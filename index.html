<!doctype html>
<html lang="en" class="light" data-tf-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twentyfour · 24-Hour Conscious Balance</title>
    <meta name="description" content="A deliberate 24-hour time ledger and wellness tracker showing how your day balances across rest, flow, and routines." />
    <meta property="og:title" content="Twentyfour · 24-Hour Conscious Balance" />
    <meta property="og:description" content="A deliberate 24-hour time ledger and wellness tracker showing how your day balances across rest, flow, and routines." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#eef1f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('tf-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          var r = document.documentElement;
          r.setAttribute('data-tf-theme', t);
          r.classList.remove('dark', 'light');
          r.classList.add(t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#eef1f8' : '#0a0d14');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
